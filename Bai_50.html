<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeLong Enterprises</title>
    <style>
        body {
            background-color: #c4f3ff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .container {
            background-color: #b4ebf7;
            border: 2px solid #006699;
            padding: 25px 40px;
            width: 700px;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
        }

        .header img {
            display: block;
            margin: 0 auto 10px;
        }

        h2 {
            color: #000066;
            margin-bottom: 10px;
        }

        hr {
            border: none;
            border-top: 1px solid #666;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            margin-right: 5px;
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            border: 1px solid #888;
            border-radius: 3px;
            padding: 4px;
        }

        textarea {
            resize: none;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        thead {
            background-color: #e6f6fa;
            font-weight: bold;
        }

        td,
        th {
            border: 1px solid #555;
            padding: 4px 8px;
        }

        .buttons {
            margin-top: 15px;
        }

        input[type="button"],
        input[type="reset"] {
            background-color: #e9f7ff;
            border: 1px solid #006699;
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 8px;
        }

        input[type="button"]:hover {
            background-color: #ccf0ff;
        }

        .footer {
            margin-top: 10px;
            font-style: italic;
        }
    </style>

    <script>
        function Submit() {
            alert('Biểu mẫu đã được gửi thành công!');
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="./hinh/DeLong.jpg" alt="DeLong Enterprises">
        </div>

        <h2>Travel Expense Report</h2>
        <hr>

        <form>
            <div>
                <label>1) First Name:</label>
                <input type="text" id="fname" size="20">
                <label>Last Name:</label>
                <input type="text" id="lname" size="20">
            </div>

            <div>
                <label>2) Social Security Number:</label>
                <input type="text" id="ssn" size="25">
            </div>

            <div>
                <label>3) Department:</label>
                <select>
                    <option selected>Accounting</option>
                    <option>Marketing</option>
                    <option>Development</option>
                    <option>Logistics</option>
                </select>
            </div>

            <div>
                <label>4) Describe the purpose of your trip:</label><br>
                <textarea rows="4"></textarea>
            </div>

            <div>
                <label>5) Itemize your travel expenses:</label>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="date"></td>
                            <td><input type="text"></td>
                            <td>
                                <select>
                                    <option>Meal</option>
                                    <option>Transport</option>
                                    <option>Lodging</option>
                                </select>
                            </td>
                            <td><input type="text" size="5"></td>
                        </tr>
                        <tr>
                            <td><input type="date"></td>
                            <td><input type="text"></td>
                            <td>
                                <select>
                                    <option>Meal</option>
                                    <option>Transport</option>
                                    <option>Lodging</option>
                                </select>
                            </td>
                            <td><input type="text" size="5"></td>
                        </tr>
                        <tr>
                            <td><input type="date"></td>
                            <td><input type="text"></td>
                            <td>
                                <select>
                                    <option>Meal</option>
                                    <option>Transport</option>
                                    <option>Lodging</option>
                                </select>
                            </td>
                            <td><input type="text" size="5"></td>
                        </tr>
                        <tr>
                            <td><input type="date"></td>
                            <td><input type="text"></td>
                            <td>
                                <select>
                                    <option>Meal</option>
                                    <option>Transport</option>
                                    <option>Lodging</option>
                                </select>
                            </td>
                            <td><input type="text" size="5"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div>
                <label>6) Have you submitted your receipts?</label>
                <input type="radio" name="receipt"> Yes
                <input type="radio" name="receipt"> No
            </div>

            <div class="buttons">
                <input type="button" value="Submit travel expenses" onclick="Submit()">
                <input type="reset" value="Reset">
            </div>

            <div class="footer">
                Questions? Contact Debbie Larson in Accounting (ext. 2150).
            </div>
        </form>
    </div>
</body>

</html>
